<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not found — Observation Deck</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0c0f">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;

            --bg: #0a0c0f;
            --panel: #111419;
            --panel-2: #161a21;
            --line: rgba(255, 255, 255, 0.07);
            --line-2: rgba(255, 255, 255, 0.14);
            --text: #e9edf2;
            --muted: #9aa4b2;
            --faint: #7c8695;
            --accent: #c6f45b;
            --down: #f87171;
            --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
            --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .panel {
            width: 100%;
            max-width: 440px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--faint);
        }

        .st { display: inline-flex; align-items: center; gap: 6px; color: var(--down); }
        .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--down); box-shadow: 0 0 8px var(--down); animation: pulse 2s infinite; }
        @keyframes pulse { 50% { opacity: 0.35; } }

        .body { padding: 22px 22px 24px; }
        .kpi { display: flex; gap: 10px; margin-bottom: 18px; }
        .kpi div { flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
        .kpi .l { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
        .kpi .v { font-size: 24px; font-weight: 600; line-height: 1.2; }
        .kpi .v.down { color: var(--down); }

        h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
        p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            background: var(--accent);
            color: var(--bg);
        }

        .btn:hover { filter: brightness(1.08); }

        @media (prefers-reduced-motion: reduce) { .st::before { animation: none; } }
    </style>
</head>
<body>
    <main class="panel">
        <div class="head"><span>🔭 Observation / Deck</span><span class="st">404</span></div>
        <div class="body">
            <div class="kpi">
                <div><div class="l">Status</div><div class="v down">404</div></div>
                <div><div class="l">Results</div><div class="v">0</div></div>
            </div>
            <h1>No tile at this address</h1>
            <p>That page isn't on the board. Everything else is still live — head back and filter from there.</p>
            <a class="btn" href="/">← Back to the board</a>
        </div>
    </main>
</body>
</html>
