name: Update Screenshots

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Capture screenshots
        run: npm run screenshots

      - name: Sync repo stats
        run: npm run github
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit updated screenshots and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ status.json github.json
          git diff --cached --quiet || git commit -m "chore: refresh screenshots, deck status + repo stats"
          git push
